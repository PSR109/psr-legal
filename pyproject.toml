[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plataforma-acciones"
version = "1.0.0"
description = "Plataforma de trading algorítmico cuantitativo con auto-aprendizaje (investigación/educación)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
real = ["yfinance>=0.2"]
dev = ["pytest>=7.0"]

[project.scripts]
plataforma-acciones = "plataforma_acciones.cli:main"

[tool.setuptools.packages.find]
include = ["plataforma_acciones*"]
