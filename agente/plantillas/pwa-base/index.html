<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{APP_NOMBRE}} — {{KEYWORD_PRINCIPAL}}</title>
    <meta name="description" content="{{APP_DESCRIPCION}}">
    <link rel="canonical" href="{{APP_URL}}">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0066cc">
    <link rel="icon" href="icon-192.png">
    <!-- Open Graph para compartir en redes -->
    <meta property="og:title" content="{{APP_NOMBRE}}">
    <meta property="og:description" content="{{APP_DESCRIPCION}}">
    <meta property="og:url" content="{{APP_URL}}">
    <meta property="og:type" content="website">
    <!-- AdSense: descomentar cuando la cuenta esté aprobada
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ADSENSE_CLIENT}}" crossorigin="anonymous"></script>
    -->
    <style>
        :root { --color: #0066cc; --texto: #1a1a1a; --gris: #666; --borde: #ddd; }
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 800px;
               margin: 0 auto; padding: 20px; line-height: 1.6; color: var(--texto); }
        h1 { font-size: 1.6rem; }
        .app { border: 1px solid var(--borde); border-radius: 12px; padding: 20px; margin: 20px 0; }
        button { background: var(--color); color: #fff; border: 0; border-radius: 8px;
                 padding: 12px 20px; font-size: 1rem; cursor: pointer; }
        button:disabled { background: var(--gris); cursor: not-allowed; }
        .ad-slot { min-height: 90px; margin: 24px 0; display: flex; align-items: center;
                   justify-content: center; color: var(--gris); font-size: 12px; }
        footer { margin-top: 60px; color: var(--gris); font-size: 14px;
                 border-top: 1px solid var(--borde); padding-top: 16px; }
        footer a { color: var(--color); }
        @media (prefers-color-scheme: dark) {
            :root { --texto: #eee; --gris: #999; --borde: #333; }
            body { background: #111; }
        }
    </style>
</head>
<body>
    <h1>{{APP_NOMBRE}}</h1>
    <p>{{APP_DESCRIPCION}}</p>

    <!-- Slot de anuncio superior (descomentar el <ins> con AdSense aprobado)
    <div class="ad-slot">
        <ins class="adsbygoogle" style="display:block" data-ad-client="{{ADSENSE_CLIENT}}"
             data-ad-slot="XXXXXXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
    -->

    <main class="app">
        <!-- Aquí va la funcionalidad de la app: 100% en el cliente, sin backend -->
    </main>

    <!-- Slot de anuncio inferior: mismo patrón que el superior -->

    <footer>
        <p><strong>Más herramientas gratis:</strong> <span id="promo-cruzada">
            <!-- Enlaces a las demás apps del portafolio; actualizar en cada ciclo -->
        </span></p>
        <p><a href="privacidad.html">Privacidad</a> · <a href="terminos.html">Términos</a></p>
    </footer>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
